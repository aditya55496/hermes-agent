name: ECINet 24/7 Multi-Agent Swarm

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Multi-Agent Swarm Orchestrator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x swarm/orchestrator.py
          python3 swarm/orchestrator.py

      - name: Commit Telemetry & Swarm Consensus
        run: |
          git config --global user.name "Hermes Swarm Orchestrator"
          git config --global user.email "hermes-swarm@users.noreply.github.com"
          git add telemetry/
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(swarm): record multi-agent consensus cycle [skip ci]"
            git push origin main
          fi
