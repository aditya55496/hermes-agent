name: Hermes Agent Cloud Runner

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Hermes command or prompt to run'
        required: true
        default: 'doctor'
      provider:
        description: 'LLM Provider'
        required: false
        default: 'openrouter'

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ripgrep curl git sqlite3

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH

      - name: Preconfigure Hermes OpenRouter Model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p $HOME/.hermes
          cat << EOF > $HOME/.hermes/.env
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF
          cat << EOF > $HOME/.hermes/config.yaml
          model:
            provider: openrouter
            default: anthropic/claude-3.7-sonnet
          terminal:
            backend: local
          EOF

      - name: Execute Task via Hermes Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          export PATH="$HOME/.hermes/bin:$PATH"
          echo "=== Executing Hermes Cloud Task ==="
          hermes ${{ github.event.inputs.command }} || true
